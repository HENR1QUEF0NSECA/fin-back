# Os valores ${...} vêm do arquivo .env na raiz do projeto (copie o .env.example).
# Os marcados com "?" são obrigatórios: sem eles o compose para com a mensagem.
services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-app-db
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    ports:
      # Porta no seu computador. Se já tiver um Postgres local na 5432,
      # defina POSTGRES_PORT no .env (a API no Docker não é afetada).
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-app-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finance
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - finance-network

volumes:
  postgres_data:

networks:
  finance-network:
    driver: bridge
