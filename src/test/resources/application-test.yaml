# Perfil dos testes: banco H2 em memória (não precisa de Postgres nem Docker).
# O schema é criado e apagado a cada execução, e o data.sql (específico do
# Postgres) não roda: cada teste cria os dados de que precisa.
spring:
  datasource:
    url: jdbc:h2:mem:finance;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

jwt:
  secret: segredo-usado-somente-nos-testes-automatizados-0123456789
  expiration: 3600000
